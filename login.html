<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <title>7innxsynC — Login</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="brand">
      7innxsynC
      <span>•</span>
    </a>
    <div class="nav-links">
      <a href="https://t.me/yat1mlau" target="_blank" rel="noopener">Contact</a>
    </div>
  </nav>

  <!-- LOGIN SECTION -->
  <section class="section">
    <div style="max-width: 420px; margin: 80px auto;">
      <div class="card reveal">
        <div style="text-align: center; margin-bottom: 32px;">
          <h1 style="font-family: 'TzX', sans-serif; color: var(--accent-cyan); margin-bottom: 8px;">7innxsynC</h1>
          <p style="color: var(--text-muted); font-size: 14px;">Database Manager Login</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username" 
              required 
              placeholder="Masukkan username"
              style="font-size: 16px;"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              required 
              placeholder="Masukkan password"
              style="font-size: 16px;"
            />
          </div>

          <div id="errorMessage" class="alert alert-error hidden" style="margin-bottom: 20px; display: none;">
            <span id="errorText"></span>
          </div>

          <button type="submit" style="width: 100%; margin-bottom: 12px;">
            <span id="loginText">Login</span>
            <span id="loginLoader" class="loading hidden" style="display: none;"></span>
          </button>

          <button type="button" class="btn-secondary" style="width: 100%;" onclick="document.getElementById('demoInfo').classList.toggle('hidden')">
            Demo Credentials
          </button>
        </form>

        <div id="demoInfo" class="hidden" style="margin-top: 20px; padding: 16px; background: rgba(31, 111, 235, 0.1); border: 1px solid var(--accent-blue); border-radius: 8px; display: none;">
          <p style="font-size: 13px; color: var(--text-main); margin: 0 0 8px;">Admin:</p>
          <code style="display: block; background: var(--bg-primary); padding: 8px; border-radius: 4px; font-size: 12px; margin-bottom: 12px; color: var(--accent-cyan); font-family: 'Fira Code', monospace;">admin / admin123</code>
          
          <p style="font-size: 13px; color: var(--text-main); margin: 0 0 8px;">User:</p>
          <code style="display: block; background: var(--bg-primary); padding: 8px; border-radius: 4px; font-size: 12px; color: var(--accent-cyan); font-family: 'Fira Code', monospace;">user / user123</code>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 13px;">
        <p>7innxsynC Database Manager v2.0</p>
      </div>
    </div>
  </section>

  <!-- SCRIPTS -->
  <script src="assets/api.js"></script>
  <script src="assets/session.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      const loginBtn = e.target.querySelector('button[type="submit"]');
      const loginText = document.getElementById('loginText');
      const loginLoader = document.getElementById('loginLoader');

      errorMsg.style.display = 'none';
      loginText.style.display = 'none';
      loginLoader.style.display = 'block';
      loginBtn.disabled = true;

      try {
        const users = await getUsers();
        const user = users.find(u => u.username === username && u.password === password);

        if (!user) {
          throw new Error('Username atau password salah');
        }

        saveSession({
          username: user.username,
          role: user.role,
          timestamp: Date.now()
        });

        window.location.href = 'index.html';
      } catch (error) {
        errorText.textContent = error.message;
        errorMsg.style.display = 'flex';
      } finally {
        loginText.style.display = 'inline';
        loginLoader.style.display = 'none';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
