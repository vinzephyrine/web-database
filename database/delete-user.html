  <script>
      const currentUser = requireLogin();

    if (currentUser) {
      if (currentUser.role !== 'admin') {
        document.getElementById('addTokenMenu').style.display = 'block';
      }
    }
const deleteUserForm = document.getElementById('deleteUserForm');
    const deleteUserMessage = document.getElementById('deleteUserMessage');
    const deleteUserBtn = document.getElementById('deleteUserBtn');
    const deleteUserBtnText = document.getElementById('deleteUserBtnText');

    function showDeleteUserMsg(text, type) {
      deleteUserMessage.className = `msg show ${type}`;
      deleteUserMessage.textContent = text;
    }

    function setDeleteUserLoading(isLoading) {
      deleteUserBtn.disabled = isLoading;
      deleteUserBtnText.innerHTML = isLoading ? '<span class="spinner"></span> Menghapus...' : 'Hapus User';
    }

    deleteUserForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('deleteUsername').value.trim();

      if (!username) {
        showDeleteUserMsg('Username harus diisi!', 'error');
        return;
      }

      setDeleteUserLoading(true);
      showDeleteUserMsg('Menghapus user...', 'loading');

      try {
        await deleteUserEntry(username);
        showDeleteUserMsg(`User "${username}" berhasil dihapus!`, 'success');
        deleteUserForm.reset();
      } catch (error) {
        if (error.message === 'USER_NOT_FOUND') {
          showDeleteUserMsg('User tidak ditemukan!', 'error');
        } else {
          showDeleteUserMsg('Gagal menghapus user!', 'error');
          console.error(error);
        }
      }

      setDeleteUserLoading(false);
    });
  </script>
