  <script>
      const currentUser = requireLogin();

    if (currentUser) {
      if (currentUser.role !== 'admin') {
        document.getElementById('addTokenMenu').style.display = 'block';
      }
    }
function showSearchMsg(text, type) {
      searchMessage.className = `msg show ${type}`;
      searchMessage.textContent = text;
    }

    async function searchNumber() {
      const number = document.getElementById('searchNumber').value.trim();
      resultBox.classList.add('hidden');

      if (!number) {
        showSearchMsg('Masukkan nomor dulu!', 'error');
        return;
      }

      searchBtn.disabled = true;
      searchBtnText.innerHTML = '<span class="spinner" style="border-color:rgba(13,13,13,0.2); border-top-color: var(--ink);"></span> Mencari...';
      searchMessage.className = 'msg';

      try {
        const entry = await findNumberEntry(number);

        if (!entry) {
          showSearchMsg('Nomor tidak ditemukan.', 'error');
        } else {
          foundNumber = entry.number;
          document.getElementById('resultNumber').textContent = '+' + entry.number;
          document.getElementById('resultDate').textContent = new Date(entry.createdAt).toLocaleString('id-ID');
          resultBox.classList.remove('hidden');
        }
      } catch (error) {
        showSearchMsg('Gagal mencari nomor!', 'error');
        console.error(error);
      }

      searchBtn.disabled = false;
      searchBtnText.textContent = 'Cari Nomor';
    }

    async function confirmDelete() {
      if (!foundNumber) return;
      if (!confirm(`Yakin hapus nomor ${foundNumber}?`)) return;

      deleteBtn.disabled = true;
      deleteBtnText.innerHTML = '<span class="spinner"></span> Menghapus...';

      try {
        await deleteNumberEntry(foundNumber);
        resultBox.classList.add('hidden');
        showSearchMsg('Nomor berhasil dihapus.', 'success');
        document.getElementById('searchNumber').value = '';
        foundNumber = null;
      } catch (error) {
        showSearchMsg('Gagal menghapus nomor!', 'error');
        console.error(error);
      }

      deleteBtn.disabled = false;
      deleteBtnText.textContent = 'Hapus Nomor Ini';
    }
  </script>
