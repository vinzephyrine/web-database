  <script>
    const currentUser = requireLogin();

    if (currentUser) {
      if (currentUser.role !== 'admin') {
        document.getElementById('addTokenMenu').style.display = 'block';
      }
      if (currentUser.role === 'admin') {
        ['listNavLink','listNavLinkMobile','deleteNavLink','deleteNavLinkMobile',
         'addUserNavLink','addUserNavLinkMobile'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.classList.remove('hidden');
        });
      }
    }

    const addForm = document.getElementById('addForm');
    const addMessage = document.getElementById('addMessage');
    const addBtn = document.getElementById('addBtn');
    const addBtnText = document.getElementById('addBtnText');

    function showAddMsg(text, type) {
      addMessage.className = `msg show ${type}`;
      addMessage.textContent = text;
    }

    function setAddLoading(isLoading) {
      addBtn.disabled = isLoading;
      addBtnText.innerHTML = isLoading ? '<span class="spinner"></span> Menyimpan...' : 'Tambahkan Nomor';
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const number = document.getElementById('numberInput').value.trim();

      if (!number) {
        showAddMsg('Nomor harus diisi!', 'error');
        return;
      }

      setAddLoading(true);
      showAddMsg('Menyimpan nomor...', 'loading');

      try {
        await addNumberEntry(number);
        showAddMsg('Nomor berhasil ditambahkan!', 'success');
        addForm.reset();
      } catch (error) {
        if (error.message === 'DUPLICATE') {
          showAddMsg('Nomor sudah ada dalam database!', 'error');
        } else {
          showAddMsg('Gagal menambahkan nomor!', 'error');
          console.error(error);
        }
      }

      setAddLoading(false);
    });
  </script>
